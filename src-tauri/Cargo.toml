[package]
name = "helixgrid"
version = "0.3.0"
description = "HelixGrid — Distributed Autonomous Drug Discovery"
authors = ["Camil Grondin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "helixgrid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
ort = "2.0.0-rc.13"
chematic = { version = "1.0.40", features = ["fp", "smiles", "mol", "chem", "smarts", "rxn", "threed"] }
tokio = { version = "1.53.2", features = ["full"] }
rand = "0.10.3"
ndarray = "0.17.2"
uuid = { version = "1.27.0", features = ["v4", "fast-rng"] }
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"
purr = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ed25519-dalek = "3.0.0"
hex = "0.4.3"

[features]
default = []
coreml = ["ort/coreml"]
directml = ["ort/directml"]
cuda = ["ort/cuda"]

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["directml"] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["cuda"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
